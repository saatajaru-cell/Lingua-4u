  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      background-color: #EEF2F6;
      color: #1E293B;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .duo-btn {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .duo-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 0 rgba(0,0,0,0.2) !important;
    }
    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      70% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @keyframes confettiBurst {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-45px) scale(1.4); opacity: 0; }
    }
    .animate-pop { animation: popIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-float { animation: floatSlow 3.2s ease-in-out infinite; }
    .animate-shake { animation: shake 0.3s ease-in-out; }
    .confetti-dot {
      position: absolute;
      pointer-events: none;
      animation: confettiBurst 0.75s ease-out forwards;
    }

    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 999px; }
    .safe-bottom { padding-bottom: calc(5.2rem + env(safe-area-inset-bottom)); }
    .nav-bottom { padding-bottom: env(safe-area-inset-bottom); }

    // --- 1. AUDIO & SOUND EFFECTS ENGINE (Web Audio API + SpeechSynthesis) ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      },
      playTone(freq, type = 'sine', duration = 0.15, delay = 0) {
        if (!AppState.data.settings.sound) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + delay);
          osc.stop(this.ctx.currentTime + delay + duration);
        } catch (e) { /* Audio blocked by browser policy */ }
      },
      success() {
        this.playTone(523.25, 'triangle', 0.14, 0);
        this.playTone(659.25, 'triangle', 0.22, 0.1);
      },
      error() {
        this.playTone(240, 'sawtooth', 0.18, 0);
        this.playTone(195, 'sawtooth', 0.22, 0.12);
      },
      levelUp() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.playTone(f, 'triangle', 0.2, i * 0.09));
      },
      speak(text, rate = 0.95, volume = 1.0, onEnd = null) {
        if (!('speechSynthesis' in window)) {
          showToast('Text-to-Speech is not supported in this browser. Read the text aloud instead.', 'warning');
          if (onEnd) onEnd();
          return false;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = rate;
        utterance.volume = volume;
        const voices = window.speechSynthesis.getVoices();
        const preferred = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha'))) || voices.find(v => v.lang.startsWith('en'));
        if (preferred) utterance.voice = preferred;
        utterance.onend = () => { if (onEnd) onEnd(); };
        utterance.onerror = () => { if (onEnd) onEnd(); };
        window.speechSynthesis.speak(utterance);
        return true;
      },
      stopSpeech() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    };

        () => {
          const conds = [
            { prompt: 'Choose the grammatically valid conditional: "If mobile notifications _____ learners at optimal intervals, long-term recall increases."', ans: 'prompt', wrong: ['prompted', 'would prompt', 'had prompted'], level: 'B1', exp: 'Zero Conditional (general scientific truth) uses Present Simple in both clauses.' },
            { prompt: 'Choose the grammatically valid conditional: "If the software _____ offline caching earlier, rural students would not have missed last week’s module."', ans: 'had included', wrong: ['included', 'would include', 'includes'], level: 'B2', exp: 'Third Conditional expresses an unreal past condition using Past Perfect ("had included").' },
            { prompt: 'Choose the advanced inverted conditional: "_____ the empirical data prove inconclusive, the researchers will extend the observation period."', ans: 'Should', wrong: ['Had', 'Were', 'Did'], level: 'C1', exp: '"Should + subject + base verb" is formal First Conditional inversion.' }
          ];
          const c = conds[Math.floor(Math.random() * conds.length)];
          return {
            id: `dyn_cond_${c.level}_${c.ans.replace(/\s+/g, '_')}`,
            level: c.level,
            skill: 'Grammar',
            prompt: c.prompt,
            options: shuffleArray([c.ans, ...c.wrong]),
            answer: c.ans,
            explanation: c.exp,
            isGenerated: true
          };
        },
        // Template 3: Contextual Academic & Everyday Vocabulary (A2-C1)
        () => {
          const lex = [
            { prompt: 'In a study evaluating mobile apps, the group that does NOT use the app serves as the _____ group.', ans: 'control', wrong: ['experimental', 'random', 'fictional'], level: 'B2', exp: 'A control group provides the baseline comparison in empirical research.' },
            { prompt: 'When a learner can understand and speak English effortlessly in complex situations, they have achieved high _____.', ans: 'fluency', wrong: ['hesitation', 'ambiguity', 'redundancy'], level: 'B1', exp: 'Fluency denotes smooth, effortless command of a language.' },
            { prompt: 'Because smartphones are portable and lightweight, learners praised the _____ of studying during short commutes.', ans: 'convenience', wrong: ['reluctance', 'interference', 'scarcity'], level: 'A2', exp: 'Convenience means ease of use and accessibility.' }
          ];
          const item = lex[Math.floor(Math.random() * lex.length)];
          return {
            id: `dyn_lex_${item.level}_${item.ans}`,
            level: item.level,
            skill: 'Vocabulary',
            prompt: item.prompt,
            options: shuffleArray([item.ans, ...item.wrong]),
            answer: item.ans,
            explanation: item.exp,
            isGenerated: true
          };
        },
        // Template 4: Reading Inference Micro-Passages (B1-C1)
        () => {
          const passages = [
            {
              prompt: 'Read: "While automated quizzes grade multiple-choice items instantaneously, open-ended writing still benefits from human rubric evaluation." What does this statement imply?',
              ans: 'Automated grading and human feedback have complementary strengths.',
              wrong: ['Automated quizzes are completely useless.', 'Human teachers should never grade essays.', 'Multiple-choice questions cannot be graded quickly.'],
              level: 'B2',
              exp: 'The contrast ("While... still...") highlights distinct strengths for each assessment method.'
            },
            {
              prompt: 'Read: "Learners who set realistic daily XP targets were twice as likely to complete the six-week curriculum as those without goals." What conclusion is supported?',
              ans: 'Goal-setting strongly correlates with course completion.',
              wrong: ['Six weeks is too short to learn English.', 'XP targets guarantee native-level proficiency.', 'Learners without goals finished faster.'],
              level: 'B1',
              exp: 'Doubling completion likelihood demonstrates a strong positive association with goal-setting.'
            }
          ];
          const p = passages[Math.floor(Math.random() * passages.length)];
          return {
            id: `dyn_read_${p.level}_${p.ans.slice(0, 12).replace(/\s+/g, '_')}`,
            level: p.level,
            skill: 'Reading',
            prompt: p.prompt,
            options: shuffleArray([p.ans, ...p.wrong]),
            answer: p.ans,
            explanation: p.exp,
            isGenerated: true
          };
        }
      ],

      /**
       * Validates question integrity: unique options, single unambiguous answer, non-empty fields.
       */
      validateQuestion(q) {
        if (!q || !q.id || !q.prompt || !Array.isArray(q.options) || q.options.length < 2) return false;
        const uniqueOpts = new Set(q.options.map(o => o.trim().toLowerCase()));
        if (uniqueOpts.size !== q.options.length) return false; // Prevent duplicate distractors
        const matches = q.options.filter(o => o === q.answer);
        return matches.length === 1; // Ensure exactly one correct answer
      },

      /**
       * Retrieves fresh unseen questions first; generates new validated questions if bank runs low.
       */
      getQuestionSet({ count = 6, level = 'ALL', skill = 'ALL', excludeIds = [] }) {
        const seenSet = new Set([...AppState.data.answeredQuestionIds, ...excludeIds]);
        
        // 1. Filter static bank + previously generated cached bank
        const combinedBank = [...STATIC_QUESTION_BANK, ...AppState.data.generatedQuestions];
        let candidates = combinedBank.filter(q => {
          const levelMatch = level === 'ALL' || q.level === level;
          const skillMatch = skill === 'ALL' || q.skill.toLowerCase() === skill.toLowerCase();
          return levelMatch && skillMatch && this.validateQuestion(q);
        });

        // 2. Prioritize UNSEEN questions
        let unseen = shuffleArray(candidates.filter(q => !seenSet.has(q.id)));

        // 3. If unseen pool is smaller than requested count, dynamically generate new questions
        let attempts = 0;
        while (unseen.length < count && attempts < 20) {
          attempts++;
          const tpl = this.templates[Math.floor(Math.random() * this.templates.length)];
          const candidate = tpl();
          if (this.validateQuestion(candidate)) {
            const levelMatch = level === 'ALL' || candidate.level === level;
            const skillMatch = skill === 'ALL' || candidate.skill.toLowerCase() === skill.toLowerCase();
            if (!seenSet.has(candidate.id) && !unseen.some(u => u.id === candidate.id)) {
              // Store newly generated question in persistent bank so it isn't recreated redundantly
              if (!AppState.data.generatedQuestions.some(g => g.id === candidate.id)) {
                AppState.data.generatedQuestions.push(candidate);
                AppState.save();
              }
              if (levelMatch && skillMatch) {
                unseen.push(candidate);
              }
            }
          }
        }

        // 4. Fill remaining slots with least-recently-seen candidates if strict filter exhausted all unseen items
        let selected = unseen.slice(0, count);
        let usedRecycled = false;
        if (selected.length < count) {
          const fallbackPool = shuffleArray(candidates.filter(q => !selected.some(s => s.id === q.id)));
          const needed = count - selected.length;
          if (fallbackPool.length > 0) {
            selected = [...selected, ...fallbackPool.slice(0, needed)];
            usedRecycled = true;
          }
        }

        // Randomize option order for every session
        return {
          questions: selected.map(q => ({ ...q, options: shuffleArray([...q.options]) })),
          usedRecycled
        };
      }
    };

    // --- 11. PERSISTENT STATE MANAGER (LocalStorage) ---
    const STORAGE_KEY = 'lingua4u_research_v1';

        skills: {
          Grammar: { answered: 0, correct: 0 },

        }
      },
      completedLessons: [], // Array of lesson IDs e.g. ['u1_l1']
      savedWords: ['v1', 'v5'], // Array of vocab IDs
      answeredQuestionIds: [], // Tracks every question ID answered to prevent repetition
      mistakeBank: [], // Array of question objects answered incorrectly for "Review Mistakes"
      generatedQuestions: [], // Stores validated dynamically generated questions

      }
    };

    const AppState = {
      data: JSON.parse(JSON.stringify(DEFAULT_STATE)),
      load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            this.data = {
              ...DEFAULT_STATE,
              ...parsed,
              user: { ...DEFAULT_STATE.user, ...(parsed.user || {}) },
              stats: {
                ...DEFAULT_STATE.stats,
                ...(parsed.stats || {}),
                skills: { ...DEFAULT_STATE.stats.skills, ...(parsed.stats?.skills || {}) }
              },
              settings: { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) }
            };
            this.checkDailyReset();
          }
        } catch (e) {
          console.error('Failed to load local state:', e);
        }
      },
      save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
          updateHeaderUI();
        } catch (e) {
          showToast('Unable to save progress locally. Check browser storage permissions.', 'error');
        }
      },
      checkDailyReset() {
        const today = new Date().toISOString().slice(0, 10);
        if (this.data.stats.lastStudyDate !== today) {
          const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
          if (this.data.stats.lastStudyDate === yesterday) {
            this.data.stats.streak += 1;
          } else {
            this.data.stats.streak = 1;
          }
          this.data.stats.dailyXp = 0;
          this.data.stats.lastStudyDate = today;
          this.save();
        }
      },
      awardXP(amount, reason = '') {
        if (!amount || amount <= 0) return;
        this.data.stats.xp += amount;
        this.data.stats.dailyXp += amount;
        // Update today's slot in weekly chart (index 6 = Today)
        this.data.stats.weeklyXp[6] = (this.data.stats.weeklyXp[6] || 0) + amount;
        this.save();
        if (reason) {
          showToast(`+${amount} XP — ${reason}`, 'success');
        }
      },
      recordAnswer(questionObj, isCorrect, skillName = 'Grammar') {
        this.data.stats.totalQuestionsAnswered += 1;
        if (isCorrect) this.data.stats.totalCorrectAnswers += 1;

        const normalizedSkill = Object.keys(this.data.stats.skills).find(
          k => k.toLowerCase() === skillName.toLowerCase()
        ) || 'Grammar';

        this.data.stats.skills[normalizedSkill].answered += 1;
        if (isCorrect) {
          this.data.stats.skills[normalizedSkill].correct += 1;
        }

        if (questionObj && questionObj.id) {
          if (!this.data.answeredQuestionIds.includes(questionObj.id)) {
            this.data.answeredQuestionIds.push(questionObj.id);
          }
          if (!isCorrect) {
            // Save to mistake bank if not already present
            if (!this.data.mistakeBank.some(m => m.id === questionObj.id)) {
              this.data.mistakeBank.push(questionObj);
            }
          } else {
            // Remove from mistake bank once mastered
            this.data.mistakeBank = this.data.mistakeBank.filter(m => m.id !== questionObj.id);
          }
        }
        this.save();
      },
      resetAll() {
        localStorage.removeItem(STORAGE_KEY);
        this.data = JSON.parse(JSON.stringify(DEFAULT_STATE));
        updateChromeVisibility();
        navigate('welcome');
      }
    };

    // --- 12. UTILITY & UI HELPERS ---
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function escapeHTML(str) {
      if (typeof str !== 'string') return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-700',
        error: 'bg-rose-600 text-white border-rose-700',
        warning: 'bg-amber-500 text-white border-amber-600',
        info: 'bg-slate-800 text-white border-slate-900'
      };
      const icons = { success: '🎉', error: '⚠️', warning: '💡', info: '✨' };
      const toast = document.createElement('div');
      toast.className = `${colors[type] || colors.info} px-4 py-3 rounded-2xl shadow-lg border-b-4 text-xs font-extrabold flex items-center gap-2.5 animate-pop`;
      toast.innerHTML = `<span class="text-base">${icons[type]}</span><span>${escapeHTML(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 2800);
    }

    function triggerCelebration(originEl) {
      if (!originEl) return;
      const rect = originEl.getBoundingClientRect();
      const emojis = ['⭐', '⚡', '✨', '🎯'];
      for (let i = 0; i < 6; i++) {
        const dot = document.createElement('span');
        dot.className = 'confetti-dot text-lg font-bold';
        dot.textContent = emojis[i % emojis.length];
        dot.style.left = `${rect.left + rect.width / 2 + (Math.random() * 80 - 40)}px`;
        dot.style.top = `${rect.top + window.scrollY}px`;
        dot.style.zIndex = '60';
        document.body.appendChild(dot);
        setTimeout(() => dot.remove(), 800);
      }
    }

      const topBar = document.getElementById('top-bar');

      if (hideAll || !AppState.data.onboarded) {

    // --- 13. ROUTER & NAVIGATION CONTROLLER ---
    let currentRoute = 'welcome';
    let routeParams = {};

    function navigate(route, params = {}) {
      AudioEngine.stopSpeech();
      currentRoute = route;
      routeParams = params;

      // Update active bottom tab highlight
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const tab = btn.getAttribute('data-tab');
        const activeTab = ['vocabulary', 'grammar', 'reading', 'listening', 'writing', 'quiz_session', 'mistakes'].includes(route)
          ? 'practice'
          : route === 'lesson' ? 'learn' : route;
        if (tab === activeTab) {
          btn.classList.remove('text-slate-400');
          btn.classList.add('text-emerald-600');
        } else {
          btn.classList.remove('text-emerald-600');
          btn.classList.add('text-slate-400');
        }
      });

      const fullScreenRoutes = ['welcome', 'onboarding', 'placement', 'lesson'];
      updateChromeVisibility(fullScreenRoutes.includes(route));

      const main = document.getElementById('main-content');
      main.scrollTop = 0;

      switch (route) {
        case 'welcome': renderWelcome(main); break;
        case 'onboarding': renderOnboarding(main); break;
        case 'placement': renderPlacementTest(main); break;
        case 'home': renderHome(main); break;
        case 'learn': renderLearn(main); break;
        case 'lesson': renderLessonRunner(main, params.lessonId); break;
        case 'practice': renderPracticeHub(main); break;
        case 'vocabulary': renderVocabularyStudio(main); break;
        case 'grammar': renderGrammarLab(main); break;
        case 'reading': renderReadingRoom(main); break;
        case 'listening': renderListeningStudio(main); break;
        case 'writing': renderWritingWorkshop(main); break;
        case 'quiz_session': renderCustomQuizSession(main, params); break;
        case 'mistakes': renderReviewMistakes(main); break;
        case 'progress': renderProgress(main); break;
        case 'profile': renderProfile(main); break;
        default: renderHome(main);
      }
    }

    const LEVEL_ORDER = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
    const LEVEL_WEIGHTS = { A1: 1, A2: 2, B1: 3, B2: 4, C1: 5, C2: 6 };

    function getNextAdaptiveQuestion(targetLevel, usedIds, skillCycleIndex) {
      const skills = ['Grammar', 'Vocabulary', 'Reading', 'Language Use'];
      const preferredSkill = skills[skillCycleIndex % skills.length];
      const pool = [...STATIC_QUESTION_BANK, ...AppState.data.generatedQuestions];

      // Try exact level + preferred skill
      let matches = pool.filter(q => q.level === targetLevel && q.skill === preferredSkill && !usedIds.includes(q.id));
      // Try exact level + any skill
      if (matches.length === 0) {
        matches = pool.filter(q => q.level === targetLevel && !usedIds.includes(q.id));
      }
      // Try adjacent level
      if (matches.length === 0) {
        const idx = LEVEL_ORDER.indexOf(targetLevel);
        const adj = [LEVEL_ORDER[idx - 1], LEVEL_ORDER[idx + 1]].filter(Boolean);
        matches = pool.filter(q => adj.includes(q.level) && !usedIds.includes(q.id));
      }
      // Fallback: generate a new question dynamically
      if (matches.length === 0) {
        const res = DynamicQuestionGenerator.getQuestionSet({ count: 1, level: 'ALL', excludeIds: usedIds });
        if (res.questions.length > 0) return res.questions[0];
      }
      const chosen = matches[Math.floor(Math.random() * matches.length)] || STATIC_QUESTION_BANK[0];
      return { ...chosen, options: shuffleArray([...chosen.options]) };
    }

    function beginPlacementSession() {
      const firstQ = getNextAdaptiveQuestion('A2', [], 0);
      placementSession = {
        totalQuestions: 15,
        index: 0,
        currentLevelIdx: 1, // Start at A2
        consecutiveCorrect: 0,
        consecutiveWrong: 0,
        usedIds: [firstQ.id],
        currentQuestion: firstQ,
        selectedOptionIdx: null,
        answeredCurrent: false,
        history: [],
        completed: false,
        result: null
      };
      renderPlacementTest(document.getElementById('main-content'));
    }

    function abortPlacement() {

    function selectPlacementOption(idx) {
      if (!placementSession || placementSession.answeredCurrent) return;
      placementSession.selectedOptionIdx = idx;
      document.querySelectorAll('.place-opt').forEach((btn, i) => {
        if (i === idx) {
          btn.className = 'place-opt w-full text-left p-4 rounded-2xl border-2 border-blue-600 bg-blue-50 font-extrabold text-blue-900 text-sm transition-all flex items-center gap-3';

    function submitPlacementAnswer() {
      if (!placementSession) return;
      if (placementSession.answeredCurrent) {
        // Advance to next question or finish
        placementSession.index += 1;
        if (placementSession.index >= placementSession.totalQuestions) {
          finalizePlacementTest();
          return;
        }
        const targetLvl = LEVEL_ORDER[placementSession.currentLevelIdx];
        const nextQ = getNextAdaptiveQuestion(targetLvl, placementSession.usedIds, placementSession.index);
        placementSession.usedIds.push(nextQ.id);
        placementSession.currentQuestion = nextQ;
        placementSession.selectedOptionIdx = null;
        placementSession.answeredCurrent = false;
        renderPlacementTest(document.getElementById('main-content'));
        return;
      }

      const q = placementSession.currentQuestion;
      const chosenText = q.options[placementSession.selectedOptionIdx];
      const isCorrect = chosenText === q.answer;
      placementSession.answeredCurrent = true;

      // Record in global history & adaptive state
      AppState.recordAnswer(q, isCorrect, q.skill);
      placementSession.history.push({
        level: q.level,
        skill: q.skill,
        isCorrect,
        weight: LEVEL_WEIGHTS[q.level] || 1
      });

      // Adaptive difficulty scaling
      if (isCorrect) {
        AudioEngine.success();
        placementSession.consecutiveCorrect += 1;
        placementSession.consecutiveWrong = 0;
        // Scale up if answered correctly (immediate step up on streak >= 1 at lower tiers, or >= 2 at upper tiers)
        if (placementSession.currentLevelIdx < LEVEL_ORDER.length - 1) {
          placementSession.currentLevelIdx += 1;
        }
      } else {
        AudioEngine.error();
        placementSession.consecutiveWrong += 1;
        placementSession.consecutiveCorrect = 0;
        if (placementSession.currentLevelIdx > 0) {
          placementSession.currentLevelIdx -= 1;
        }
      }

      // Highlight options
      document.querySelectorAll('.place-opt').forEach((btn, i) => {
        const txt = q.options[i];
        if (txt === q.answer) {
          btn.className = 'place-opt w-full text-left p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-50 font-extrabold text-emerald-900 text-sm flex items-center gap-3';
        } else if (i === placementSession.selectedOptionIdx && !isCorrect) {
          btn.className = 'place-opt w-full text-left p-4 rounded-2xl border-2 border-rose-500 bg-rose-50 font-extrabold text-rose-900 text-sm flex items-center gap-3';
        }
      });

      const fb = document.getElementById('placement-feedback');
      fb.classList.remove('hidden');
      fb.className = `mt-4 p-4 rounded-2xl text-xs font-bold animate-pop ${isCorrect ? 'bg-emerald-100 text-emerald-900 border border-emerald-300' : 'bg-rose-100 text-rose-900 border border-rose-300'}`;
      fb.innerHTML = `${isCorrect ? '✅ Correct!' : `❌ Correct answer: ${escapeHTML(q.answer)}`} — ${escapeHTML(q.explanation || '')}`;

      const actionBtn = document.getElementById('placement-action-btn');
      actionBtn.textContent = placementSession.index + 1 >= placementSession.totalQuestions ? 'View CEFR Diagnostic Report' : 'Next Question →';
      actionBtn.className = 'duo-btn w-full py-4 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-black text-base shadow-[0_4px_0_0_#1D4ED8]';
    }

    function finalizePlacementTest() {
      const hist = placementSession.history;
      const totalCorrect = hist.filter(h => h.isCorrect).length;
      const maxPossibleWeight = hist.reduce((acc, h) => acc + h.weight, 0) || 1;
      const earnedWeight = hist.reduce((acc, h) => acc + (h.isCorrect ? h.weight : 0), 0);
      const weightedScorePct = Math.round((earnedWeight / maxPossibleWeight) * 100);

      // Deterministic CEFR threshold mapping based on earned weighted points & highest mastered tier
      let cefr = 'A1';
      if (earnedWeight >= 48 && totalCorrect >= 13) cefr = 'C2';
      else if (earnedWeight >= 38 && totalCorrect >= 11) cefr = 'C1';
      else if (earnedWeight >= 28 && totalCorrect >= 9) cefr = 'B2';
      else if (earnedWeight >= 19 && totalCorrect >= 7) cefr = 'B1';
      else if (earnedWeight >= 10 && totalCorrect >= 4) cefr = 'A2';
      else cefr = 'A1';

      // Per-skill breakdown
      const skillScores = {};
      ['Grammar', 'Vocabulary', 'Reading', 'Language Use'].forEach(sk => {
        const items = hist.filter(h => h.skill === sk);
        const corr = items.filter(h => h.isCorrect).length;
        skillScores[sk] = items.length ? Math.round((corr / items.length) * 100) : 0;
      });

      const sortedSkills = Object.entries(skillScores).sort((a, b) => b[1] - a[1]);
      const strengths = sortedSkills.filter(s => s[1] >= 60).map(s => `${s[0]} (${s[1]}%)`);
      const areasToImprove = sortedSkills.filter(s => s[1] < 60).map(s => `${s[0]} (${s[1]}%)`);

      const unitRecommendations = {
        A1: 'Unit 1: Basic English — Greetings, Introductions & Everyday Expressions',
        A2: 'Unit 2 & Unit 3: Essential Vocabulary & Core Grammar Tenses',
        B1: 'Unit 4: Intermediate English — Present Perfect, Modals & Conditionals',
        B2: 'Unit 5: Upper-Intermediate Mastery — Relative Clauses & Mixed Conditionals',
        C1: 'Unit 6: Advanced & Proficient English — Inversion, Clefts & Nuance',
        C2: 'Unit 6 + C1/C2 Reading Room & Writing Workshop Mastery'
      };

      const result = {
        cefr,
        levelLabel: `${cefr} — ${CEFR_LEVELS[cefr].name}`,
        description: CEFR_LEVELS[cefr].desc,
        totalCorrect,
        totalQuestions: hist.length,
        weightedScorePct,
        skillScores,
        strengths: strengths.length ? strengths : ['Foundational Effort & Engagement'],
        areasToImprove: areasToImprove.length ? areasToImprove : ['Advanced Idiomatic & Syntactic Nuance'],
        recommendedPath: unitRecommendations[cefr],
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      };

      AppState.data.user.cefrLevel = cefr;
      AppState.data.user.placementTaken = true;
      AppState.data.user.lastPlacementResult = result;
      AppState.awardXP(50, 'Completed CEFR Placement Test');
      AudioEngine.levelUp();

      placementSession.completed = true;
      placementSession.result = result;
      renderPlacementResults(document.getElementById('main-content'), result);
    }

    // ============================================================================
    // VIEW 4: LEARN — STRUCTURED LEARNING PATH (UNITS & LESSONS)
    // ============================================================================
    function renderLearn(container) {
      const completed = AppState.data.completedLessons;
      const allLessons = CURRICULUM.flatMap(u => u.lessons);

      // Determine unlocked lessons: all lessons up to the first uncompleted lesson, PLUS units at or below user's placed CEFR level
      const userLevelIdx = LEVEL_ORDER.indexOf(AppState.data.user.cefrLevel);

      container.innerHTML = `
        <div class="p-4 space-y-5">
          <div class="flex items-center justify-between">
            <div>
              <h1 class="text-xl font-black text-slate-900">Learning Path</h1>
              <p class="text-xs text-slate-500 font-semibold">Structured CEFR A1 to C2 curriculum</p>
            </div>
            <span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-black">
              ${completed.length}/${allLessons.length} Done
            </span>
          </div>

          ${CURRICULUM.map((unit, uIdx) => {
            const unitCompletedCount = unit.lessons.filter(l => completed.includes(l.id)).length;
            const unitPct = Math.round((unitCompletedCount / unit.lessons.length) * 100);
            const unitLevelIdx = LEVEL_ORDER.indexOf(unit.level);
            const unitUnlockedByPlacement = unitLevelIdx <= userLevelIdx;

            const bannerColors = {
              emerald: 'from-emerald-500 to-teal-600',
              blue: 'from-blue-600 to-indigo-600',
              violet: 'from-violet-600 to-purple-700',
              amber: 'from-amber-500 to-orange-600',
              rose: 'from-rose-500 to-pink-600',
              indigo: 'from-indigo-600 to-slate-800'
            };

            return `
              <div class="bg-white rounded-3xl border border-slate-200/90 overflow-hidden shadow-xs">
                <div class="bg-gradient-to-r ${bannerColors[unit.color] || bannerColors.emerald} p-4 text-white">
                  <div class="flex items-center justify-between">
                    <span class="bg-white/20 text-white text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full">CEFR ${unit.level}</span>
                    <span class="text-xs font-extrabold">${unitPct}% Complete</span>
                  </div>
                  <h2 class="text-lg font-black mt-1">${escapeHTML(unit.title)}</h2>
                  <p class="text-xs text-white/85 font-semibold">${escapeHTML(unit.subtitle)}</p>
                  <div class="h-2 bg-black/20 rounded-full overflow-hidden mt-3">
                    <div class="h-full bg-white rounded-full transition-all" style="width: ${unitPct}%"></div>
                  </div>
                </div>

                <div class="p-4 space-y-2.5">
                  ${unit.lessons.map((lesson, lIdx) => {
                    const isDone = completed.includes(lesson.id);
                    const globalIdx = allLessons.findIndex(x => x.id === lesson.id);
                    const prevLessonDone = globalIdx === 0 || completed.includes(allLessons[globalIdx - 1].id);
                    const isUnlocked = isDone || prevLessonDone || (unitUnlockedByPlacement && lIdx === 0);

                    return `
                      <div class="flex items-center justify-between p-3.5 rounded-2xl border ${isDone ? 'bg-emerald-50/70 border-emerald-200' : isUnlocked ? 'bg-white border-slate-200 shadow-2xs' : 'bg-slate-50 border-slate-200/70 opacity-70'}">
                        <div class="flex items-center gap-3 pr-2">
                          <div class="w-10 h-10 rounded-2xl flex items-center justify-center font-black text-sm shrink-0 ${isDone ? 'bg-emerald-500 text-white' : isUnlocked ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-500'}">
                            ${isDone ? '✓' : isUnlocked ? (lIdx + 1) : '🔒'}
                          </div>
                          <div>
                            <h4 class="font-extrabold text-slate-900 text-sm leading-snug">${escapeHTML(lesson.title)}</h4>
                            <span class="text-[11px] font-bold ${isDone ? 'text-emerald-700' : 'text-slate-500'}">
                              ${isDone ? 'Completed • Tap to Review' : isUnlocked ? `Unlocked • +${lesson.xp} XP` : 'Complete previous lesson to unlock'}
                            </span>
                          </div>
                        </div>

                        ${isUnlocked ? `
                          <button onclick="navigate('lesson', { lessonId: '${lesson.id}' })" class="duo-btn px-3.5 py-2 rounded-xl text-xs font-black shrink-0 ${isDone ? 'bg-white border border-emerald-300 text-emerald-700' : 'bg-emerald-500 text-white shadow-[0_3px_0_0_#059669]'}">

                          </button>

          }).join('')}

    // ============================================================================
    // VIEW 5: 8-STEP STRUCTURED INTERACTIVE LESSON RUNNER
    // ============================================================================
    let activeLessonState = null;

    function renderLessonRunner(container, lessonId) {
      const allLessons = CURRICULUM.flatMap(u => u.lessons.map(l => ({ ...l, unitTitle: u.title })));
      const lesson = allLessons.find(l => l.id === lessonId);
      if (!lesson) {
        navigate('learn');
        return;
      }

      if (!activeLessonState || activeLessonState.lessonId !== lessonId) {
        // Build 8-step sequence:
        // 0: Intro & Objectives, 1: Short Explanation, 2: Vocabulary & Examples,
        // 3..3+exercises.length-1: Interactive Exercises & Knowledge Check, Final: Summary & XP
        activeLessonState = {
          lessonId,
          stepIndex: 0,
          exerciseAnswers: {},
          exerciseCorrectness: {},
          orderSelections: {},
          completed: false
        };
      }

      const totalSteps = 4 + lesson.exercises.length; // Intro(0), Explanation(1), Vocab(2), Exercises(3..N), Summary(last)
      const sIdx = activeLessonState.stepIndex;
      const pct = Math.round(((sIdx + 1) / totalSteps) * 100);

      let stepHTML = '';

      // STEP 1 & 2: Lesson Introduction & Learning Objectives
      if (sIdx === 0) {
        stepHTML = `
          <div class="space-y-4 animate-pop">
            <span class="inline-block px-3 py-1 rounded-full bg-blue-100 text-blue-700 text-xs font-black uppercase">Step 1 • Introduction & Objectives</span>
            <h1 class="text-2xl font-black text-slate-900">${escapeHTML(lesson.title)}</h1>
            <div class="bg-white rounded-3xl p-5 border border-slate-200">
              <h3 class="text-xs font-black uppercase text-slate-400 mb-1.5">Lesson Introduction</h3>
              <p class="text-sm text-slate-700 font-semibold leading-relaxed">${escapeHTML(lesson.intro)}</p>
            </div>
            <div class="bg-emerald-50 rounded-3xl p-5 border border-emerald-200">
              <h3 class="text-xs font-black uppercase text-emerald-800 mb-2.5">🎯 Learning Objectives</h3>
              <ul class="space-y-2">
                ${lesson.objectives.map(obj => `
                  <li class="flex items-start gap-2 text-sm font-bold text-emerald-950">
                    <span class="text-emerald-600">✓</span>
                    <span>${escapeHTML(obj)}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
          </div>
        `;
      }
      // STEP 3: Concise Explanation
      else if (sIdx === 1) {
        stepHTML = `
          <div class="space-y-4 animate-pop">
            <span class="inline-block px-3 py-1 rounded-full bg-violet-100 text-violet-700 text-xs font-black uppercase">Step 2 • Core Concept</span>
            <h2 class="text-xl font-black text-slate-900">Key Rules & Usage</h2>
            <div class="bg-white rounded-3xl p-5 border-2 border-violet-100 shadow-xs">
              <p class="text-base text-slate-800 font-bold leading-relaxed">${escapeHTML(lesson.explanation)}</p>
            </div>
            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-xs text-amber-900 font-semibold">
              💡 <strong>Study Tip:</strong> Read the explanation aloud once before moving to the vocabulary examples.
            </div>
          </div>
        `;
      }
      // STEP 4: Vocabulary and Examples
      else if (sIdx === 2) {
        stepHTML = `
          <div class="space-y-4 animate-pop">
            <span class="inline-block px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-black uppercase">Step 3 • Vocabulary & Examples</span>
            <h2 class="text-xl font-black text-slate-900">Key Expressions in Context</h2>
            <div class="space-y-3">
              ${lesson.vocab.map(v => `
                <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-2xs">
                  <div class="flex items-center justify-between mb-1">
                    <div>
                      <span class="text-lg font-black text-slate-900">${escapeHTML(v.word)}</span>
                      <span class="text-xs font-bold text-slate-400 ml-2">${escapeHTML(v.ipa)} • ${escapeHTML(v.pos)}</span>
                    </div>
                    <button onclick="AudioEngine.speak('${escapeHTML(v.word)}. ${escapeHTML(v.example)}')" class="w-10 h-10 rounded-2xl bg-blue-50 hover:bg-blue-100 text-blue-600 flex items-center justify-center text-lg" title="Listen">
                      🔊
                    </button>
                  </div>
                  <p class="text-xs font-bold text-slate-600 mb-2">${escapeHTML(v.def)}</p>
                  <div class="bg-slate-50 rounded-xl p-2.5 text-xs font-semibold text-slate-700 border border-slate-100">
                    "${escapeHTML(v.example)}"
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
      // STEP 5 & 6: Interactive Exercises & Knowledge Check
      else if (sIdx >= 3 && sIdx < 3 + lesson.exercises.length) {
        const exIdx = sIdx - 3;
        const ex = lesson.exercises[exIdx];
        const isLastEx = exIdx === lesson.exercises.length - 1;
        const answeredCorrectly = activeLessonState.exerciseCorrectness[ex.id] === true;
        const attemptedWrong = activeLessonState.exerciseCorrectness[ex.id] === false;

        stepHTML = `
          <div class="space-y-4 animate-pop">
            <span class="inline-block px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-black uppercase">
              ${isLastEx ? 'Knowledge Check' : `Interactive Exercise ${exIdx + 1} of ${lesson.exercises.length}`}
            </span>
            <h2 class="text-lg font-black text-slate-900 leading-snug">${escapeHTML(ex.prompt)}</h2>

            ${ex.type === 'mcq' ? `
              <div class="space-y-2.5">
                ${ex.options.map(opt => {
                  const chosen = activeLessonState.exerciseAnswers[ex.id] === opt;
                  let cls = 'border-slate-200 bg-white text-slate-800';
                  if (chosen && answeredCorrectly) cls = 'border-emerald-500 bg-emerald-50 text-emerald-900';
                  else if (chosen && attemptedWrong) cls = 'border-rose-500 bg-rose-50 text-rose-900';
                  return `
                    <button onclick="checkLessonMCQ('${lesson.id}', '${ex.id}', '${escapeHTML(opt)}')" class="w-full text-left p-4 rounded-2xl border-2 ${cls} font-bold text-sm transition-all">
                      ${escapeHTML(opt)}
                    </button>
                  `;
                }).join('')}
              </div>
            ` : ''}

            ${ex.type === 'fill' ? `
              <div class="space-y-3">
                <input id="lesson-fill-input" type="text" value="${escapeHTML(activeLessonState.exerciseAnswers[ex.id] || '')}" placeholder="Type your answer here..." class="w-full px-4 py-3.5 rounded-2xl border-2 border-slate-300 focus:border-blue-500 focus:outline-none font-bold text-base" />
                <button onclick="checkLessonFill('${lesson.id}', '${ex.id}')" class="duo-btn px-5 py-3 rounded-2xl bg-blue-600 text-white font-black text-sm shadow-[0_3px_0_0_#1D4ED8]">
                  Verify Answer
                </button>
              </div>
            ` : ''}

            ${ex.type === 'order' ? (() => {
              const picked = activeLessonState.orderSelections[ex.id] || [];
              const remaining = ex.words.filter((w, i) => !picked.some(p => p.idx === i));
              return `
                <div class="space-y-3">
                  <div class="min-h-14 p-3 rounded-2xl bg-white border-2 border-dashed border-slate-300 flex flex-wrap gap-2">
                    ${picked.length === 0 ? '<span class="text-xs text-slate-400 font-bold">Tap words below in order...</span>' : ''}
                    ${picked.map((p, pIdx) => `
                      <button onclick="removeOrderWord('${lesson.id}', '${ex.id}', ${pIdx})" class="px-3 py-1.5 rounded-xl bg-blue-100 text-blue-900 font-extrabold text-sm">
                        ${escapeHTML(p.word)}
                      </button>
                    `).join('')}
                  </div>
                  <div class="flex flex-wrap gap-2">
                    ${ex.words.map((w, wIdx) => {
                      const used = picked.some(p => p.idx === wIdx);
                      return `
                        <button ${used ? 'disabled' : ''} onclick="addOrderWord('${lesson.id}', '${ex.id}', ${wIdx}, '${escapeHTML(w)}')" class="px-3.5 py-2 rounded-xl border-2 font-extrabold text-sm ${used ? 'bg-slate-100 text-slate-300 border-slate-100' : 'bg-white border-slate-200 text-slate-800 hover:border-blue-400'}">
                          ${escapeHTML(w)}
                        </button>
                      `;
                    }).join('')}
                  </div>
                  <button onclick="checkLessonOrder('${lesson.id}', '${ex.id}')" class="duo-btn px-5 py-3 rounded-2xl bg-blue-600 text-white font-black text-sm shadow-[0_3px_0_0_#1D4ED8]">
                    Check Sentence
                  </button>
                </div>
              `;
            })() : ''}

            ${answeredCorrectly ? `
              <div class="p-4 rounded-2xl bg-emerald-100 border border-emerald-300 text-emerald-900 text-xs font-extrabold animate-pop">
                🎉 Excellent! That is completely correct. Tap "Continue" below.
              </div>
            ` : ''}

            ${attemptedWrong ? `
              <div class="p-4 rounded-2xl bg-rose-100 border border-rose-300 text-rose-900 text-xs font-extrabold animate-shake">
                ⚠️ Not quite right. Hint: ${escapeHTML(ex.hint || `Expected answer: ${ex.answer}`)}. Try again!
              </div>
            ` : ''}
          </div>
        `;
      }
      // STEP 7 & 8: Lesson Summary & Final Score / XP
      else {
        const alreadyCompleted = AppState.data.completedLessons.includes(lesson.id);
        stepHTML = `
          <div class="text-center space-y-5 py-4 animate-pop">
            <div class="w-24 h-24 mx-auto rounded-3xl bg-gradient-to-br from-amber-400 to-orange-500 text-white flex items-center justify-center text-5xl shadow-lg">
              🏆
            </div>
            <div>
              <span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-black uppercase">Lesson Summary</span>
              <h2 class="text-2xl font-black text-slate-900 mt-2">${escapeHTML(lesson.title)} Complete!</h2>
              <p class="text-sm text-slate-600 font-semibold mt-1">
                You mastered ${lesson.vocab.length} key expressions and ${lesson.exercises.length} interactive checks.
              </p>
            </div>

            <div class="bg-white rounded-3xl p-5 border border-slate-200 grid grid-cols-2 gap-4">
              <div>
                <span class="text-xs font-extrabold text-slate-400 uppercase">Score</span>
                <p class="text-2xl font-black text-emerald-600">100%</p>
              </div>
              <div>
                <span class="text-xs font-extrabold text-slate-400 uppercase">XP Earned</span>
                <p class="text-2xl font-black text-blue-600">${alreadyCompleted ? '+5 XP (Review)' : `+${lesson.xp} XP`}</p>
              </div>
            </div>
          </div>
        `;
      }

      const isExerciseStep = sIdx >= 3 && sIdx < 3 + lesson.exercises.length;
      const currentEx = isExerciseStep ? lesson.exercises[sIdx - 3] : null;
      const canProceed = !isExerciseStep || activeLessonState.exerciseCorrectness[currentEx.id] === true;
      const isFinalStep = sIdx === totalSteps - 1;

      container.innerHTML = `
        <div class="min-h-screen bg-slate-50 p-5 flex flex-col justify-between">
          <div>
            <!-- Top Bar -->
            <div class="flex items-center gap-3 mb-6">
              <button onclick="activeLessonState=null; navigate('learn')" class="text-slate-400 hover:text-slate-700 font-black text-lg">✕</button>
              <div class="flex-1 h-3.5 bg-slate-200 rounded-full overflow-hidden">
                <div class="h-full bg-emerald-500 transition-all duration-300 rounded-full" style="width: ${pct}%"></div>
              </div>
              <span class="text-xs font-black text-slate-500">${sIdx + 1}/${totalSteps}</span>
            </div>

            ${stepHTML}
          </div>

          <div class="pt-6 pb-2 flex gap-3">
            ${sIdx > 0 && !isFinalStep ? `
              <button onclick="prevLessonStep('${lesson.id}')" class="px-5 py-4 rounded-2xl bg-white border-2 border-slate-200 text-slate-700 font-black text-sm">
                Back
              </button>
            ` : ''}
            <button id="lesson-next-btn" ${!canProceed ? 'disabled' : ''} onclick="nextLessonStep('${lesson.id}', ${totalSteps}, ${lesson.xp})" class="duo-btn flex-1 py-4 rounded-2xl font-black text-base transition-all ${canProceed ? 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-[0_4px_0_0_#059669]' : 'bg-slate-200 text-slate-400'}">
              ${isFinalStep ? 'Finish & Return to Path' : 'Continue'}
            </button>
          </div>
        </div>
      `;
    }

    function prevLessonStep(lessonId) {
      if (activeLessonState && activeLessonState.stepIndex > 0) {
        activeLessonState.stepIndex -= 1;
        renderLessonRunner(document.getElementById('main-content'), lessonId);
      }
    }

    function nextLessonStep(lessonId, totalSteps, lessonXp) {
      if (!activeLessonState) return;
      if (activeLessonState.stepIndex < totalSteps - 1) {
        activeLessonState.stepIndex += 1;
        if (activeLessonState.stepIndex === totalSteps - 1 && !activeLessonState.completed) {
          activeLessonState.completed = true;
          const alreadyDone = AppState.data.completedLessons.includes(lessonId);
          if (!alreadyDone) {
            AppState.data.completedLessons.push(lessonId);
            AppState.awardXP(lessonXp, 'Lesson Completed');
          } else {
            AppState.awardXP(5, 'Lesson Review Bonus');
          }
          AudioEngine.levelUp();
          triggerCelebration(document.getElementById('lesson-next-btn'));
        }
        renderLessonRunner(document.getElementById('main-content'), lessonId);
      } else {
        activeLessonState = null;
        navigate('learn');
      }
    }

    function checkLessonMCQ(lessonId, exId, chosen) {
      const lesson = CURRICULUM.flatMap(u => u.lessons).find(l => l.id === lessonId);
      const ex = lesson.exercises.find(e => e.id === exId);
      const isCorrect = chosen === ex.answer;
      activeLessonState.exerciseAnswers[exId] = chosen;
      activeLessonState.exerciseCorrectness[exId] = isCorrect;
      AppState.recordAnswer({ id: ex.id, prompt: ex.prompt, options: ex.options, answer: ex.answer, skill: 'Grammar' }, isCorrect, 'Grammar');
      if (isCorrect) {
        AudioEngine.success();
        triggerCelebration(document.getElementById('lesson-next-btn'));
      } else {
        AudioEngine.error();
      }
      renderLessonRunner(document.getElementById('main-content'), lessonId);
    }

    function checkLessonFill(lessonId, exId) {
      const lesson = CURRICULUM.flatMap(u => u.lessons).find(l => l.id === lessonId);
      const ex = lesson.exercises.find(e => e.id === exId);
      const val = (document.getElementById('lesson-fill-input')?.value || '').trim();
      const isCorrect = val.toLowerCase() === ex.answer.toLowerCase();
      activeLessonState.exerciseAnswers[exId] = val;
      activeLessonState.exerciseCorrectness[exId] = isCorrect;
      AppState.recordAnswer({ id: ex.id, prompt: ex.prompt, answer: ex.answer, skill: 'Vocabulary' }, isCorrect, 'Vocabulary');
      if (isCorrect) AudioEngine.success(); else AudioEngine.error();
      renderLessonRunner(document.getElementById('main-content'), lessonId);
    }

    function addOrderWord(lessonId, exId, wIdx, word) {
      if (!activeLessonState.orderSelections[exId]) activeLessonState.orderSelections[exId] = [];
      activeLessonState.orderSelections[exId].push({ idx: wIdx, word });
      renderLessonRunner(document.getElementById('main-content'), lessonId);
    }

    function removeOrderWord(lessonId, exId, pIdx) {
      activeLessonState.orderSelections[exId].splice(pIdx, 1);
      renderLessonRunner(document.getElementById('main-content'), lessonId);
    }

    function checkLessonOrder(lessonId, exId) {
      const lesson = CURRICULUM.flatMap(u => u.lessons).find(l => l.id === lessonId);
      const ex = lesson.exercises.find(e => e.id === exId);
      const built = (activeLessonState.orderSelections[exId] || []).map(p => p.word).join(' ');
      const isCorrect = built.replace(/\s+/g, ' ').trim() === ex.answer.replace(/\s+/g, ' ').trim();
      activeLessonState.exerciseCorrectness[exId] = isCorrect;
      AppState.recordAnswer({ id: ex.id, prompt: ex.prompt, answer: ex.answer, skill: 'Writing' }, isCorrect, 'Writing');
      if (isCorrect) AudioEngine.success(); else AudioEngine.error();
      renderLessonRunner(document.getElementById('main-content'), lessonId);

    function selectQuizOption(idx) {
      if (!quizSession || quizSession.answered) return;
      quizSession.selectedOpt = idx;
      renderCustomQuizSession(document.getElementById('main-content'), quizSession.params);
    }

    function submitQuizStep() {
      if (!quizSession) return;
      if (quizSession.answered) {
        quizSession.idx += 1;
        if (quizSession.idx >= quizSession.questions.length) {
          quizSession.finished = true;
          const xpEarned = quizSession.correctCount * 10;
          if (xpEarned > 0) AppState.awardXP(xpEarned, 'Practice Set Completed');
          if (quizSession.params.isDailyChallenge) {
            AppState.data.dailyChallengeCompletedDate = new Date().toISOString().slice(0, 10);
            AppState.awardXP(30, 'Daily Challenge Bonus');
          }
          AudioEngine.levelUp();
        } else {
          quizSession.selectedOpt = null;
          quizSession.answered = false;
        }
        renderCustomQuizSession(document.getElementById('main-content'), quizSession.params);
        return;
      }

      const q = quizSession.questions[quizSession.idx];
      const isCorrect = q.options[quizSession.selectedOpt] === q.answer;
      quizSession.answered = true;
      if (isCorrect) {
        quizSession.correctCount += 1;
        AudioEngine.success();
      } else {
        AudioEngine.error();
      }
      AppState.recordAnswer(q, isCorrect, q.skill);
      renderCustomQuizSession(document.getElementById('main-content'), quizSession.params);
    }

            <div onclick="vocabState.flipped = !vocabState.flipped; renderVocabularyStudio(document.getElementById('main-content'))" class="cursor-pointer bg-white rounded-3xl p-7 border-2 border-emerald-200 shadow-sm min-h-60 flex flex-col items-center justify-center text-center animate-pop">
              <span class="text-[11px] font-black uppercase text-emerald-600 mb-2">${vocabState.flipped ? 'Definition & Example' : `Card ${idx + 1} of ${filteredWords.length} • Tap to Flip`}</span>
              ${!vocabState.flipped ? `
                <h2 class="text-3xl font-black text-slate-900 mb-1">${escapeHTML(card.word)}</h2>
                <p class="text-sm font-bold text-slate-400">${escapeHTML(card.ipa)} (${escapeHTML(card.pos)})</p>
                <button onclick="event.stopPropagation(); AudioEngine.speak('${escapeHTML(card.word)}')" class="mt-4 px-4 py-2 rounded-full bg-blue-50 text-blue-600 text-xs font-black">🔊 Listen</button>
              ` : `
                <p class="text-base font-extrabold text-slate-900 mb-3">${escapeHTML(card.def)}</p>
                <p class="text-xs italic text-slate-600 bg-slate-50 p-3 rounded-2xl">"${escapeHTML(card.example)}"</p>
              `}
            </div>
            <div class="flex gap-3">
              <button onclick="vocabState.flashIdx = (vocabState.flashIdx - 1 + ${filteredWords.length}) % ${filteredWords.length}; vocabState.flipped=false; renderVocabularyStudio(document.getElementById('main-content'))" class="flex-1 py-3.5 rounded-2xl bg-white border-2 border-slate-200 font-black text-sm text-slate-700">← Previous</button>
              <button onclick="vocabState.flashIdx = (vocabState.flashIdx + 1) % ${filteredWords.length}; vocabState.flipped=false; renderVocabularyStudio(document.getElementById('main-content'))" class="flex-1 py-3.5 rounded-2xl bg-emerald-500 text-white font-black text-sm shadow-[0_3px_0_0_#059669]">Next Card →</button>
            </div>
          </div>
        `;
      } else if (vocabState.mode === 'match') {
        const subset = filteredWords.slice(0, 4);
        const shuffledDefs = shuffleArray(subset.map(w => ({ id: w.id, def: w.note })));
        stage.innerHTML = `
          <div class="bg-white rounded-3xl p-4 border border-slate-200 space-y-3">
            <p class="text-xs font-extrabold text-slate-600">Tap an English word, then tap its matching meaning:</p>
            <div class="grid grid-cols-2 gap-2.5">
              <div class="space-y-2">
                ${subset.map(w => {
                  const solved = vocabState.matchSolved.includes(w.id);
                  const active = vocabState.matchSelectedWord === w.id;
                  return `
                    <button ${solved ? 'disabled' : ''} onclick="selectMatchWord('${w.id}')" class="w-full p-3 rounded-2xl border-2 text-xs font-black ${solved ? 'bg-emerald-50 border-emerald-200 text-emerald-600 opacity-60' : active ? 'bg-blue-50 border-blue-600 text-blue-900' : 'bg-white border-slate-200 text-slate-800'}">
                      ${escapeHTML(w.word)} ${solved ? '✓' : ''}
                    </button>
                  `;
                }).join('')}
              </div>
              <div class="space-y-2">
                ${shuffledDefs.map(d => {
                  const solved = vocabState.matchSolved.includes(d.id);
                  return `
                    <button ${solved ? 'disabled' : ''} onclick="selectMatchDef('${d.id}')" class="w-full p-3 rounded-2xl border-2 text-left text-[11px] font-bold ${solved ? 'bg-emerald-50 border-emerald-200 text-emerald-600 opacity-60' : 'bg-slate-50 border-slate-200 text-slate-700 hover:border-blue-400'}">
                      ${escapeHTML(d.def)}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      } else if (vocabState.mode === 'meaning') {
        const target = filteredWords[vocabState.flashIdx % filteredWords.length];
        const distractors = shuffleArray(VOCAB_BANK.filter(w => w.id !== target.id)).slice(0, 3);
        const options = shuffleArray([target, ...distractors]);
        stage.innerHTML = `
          <div class="bg-white rounded-3xl p-5 border border-slate-200 space-y-4">
            <span class="text-[11px] font-black uppercase text-blue-600">Choose the Correct Meaning</span>
            <div class="flex items-center justify-between">
              <h3 class="text-2xl font-black text-slate-900">${escapeHTML(target.word)}</h3>
              <button onclick="AudioEngine.speak('${escapeHTML(target.word)}')" class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600">🔊</button>
            </div>
            <div class="space-y-2">
              ${options.map(o => `
                <button onclick="checkVocabMeaning('${target.id}', '${o.id}')" class="w-full text-left p-3.5 rounded-2xl border-2 border-slate-200 hover:border-emerald-500 text-xs font-bold text-slate-800">
                  ${escapeHTML(o.def)}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    function setVocabMode(m) { vocabState.mode = m; vocabState.matchSolved = []; vocabState.matchSelectedWord = null; renderVocabularyStudio(document.getElementById('main-content')); }
    function setVocabCat(c) { vocabState.category = c; vocabState.flashIdx = 0; vocabState.matchSolved = []; renderVocabularyStudio(document.getElementById('main-content')); }
    function toggleSaveWord(id) {
      if (AppState.data.savedWords.includes(id)) {
        AppState.data.savedWords = AppState.data.savedWords.filter(x => x !== id);
        showToast('Removed from Saved Words', 'info');
      } else {
        AppState.data.savedWords.push(id);
        showToast('Saved to your personal word list!', 'success');
      }
      AppState.save();
      renderVocabularyStudio(document.getElementById('main-content'));
    }
    function selectMatchWord(id) {
      vocabState.matchSelectedWord = id;
      renderVocabularyStudio(document.getElementById('main-content'));
    }
    function selectMatchDef(defId) {
      if (!vocabState.matchSelectedWord) {
        showToast('Select a word on the left first!', 'warning');
        return;
      }
      if (vocabState.matchSelectedWord === defId) {
        AudioEngine.success();
        vocabState.matchSolved.push(defId);
        vocabState.matchSelectedWord = null;
        AppState.recordAnswer({ id: `match_${defId}`, prompt: 'Vocabulary Match', answer: defId, skill: 'Vocabulary' }, true, 'Vocabulary');
        if (vocabState.matchSolved.length >= 4) {
          AppState.awardXP(15, 'Matched All Vocabulary Pairs');
          vocabState.matchSolved = [];
        }
      } else {
        AudioEngine.error();
        showToast('Not a match — try again!', 'error');
        vocabState.matchSelectedWord = null;
      }
      renderVocabularyStudio(document.getElementById('main-content'));
    }
    function checkVocabMeaning(targetId, chosenId) {
      const isCorrect = targetId === chosenId;
      AppState.recordAnswer({ id: `vmean_${targetId}`, prompt: 'Vocabulary Meaning', answer: targetId, skill: 'Vocabulary' }, isCorrect, 'Vocabulary');
      if (isCorrect) {
        AudioEngine.success();
        AppState.awardXP(5, 'Correct Vocabulary Meaning');
        vocabState.flashIdx += 1;
      } else {
        AudioEngine.error();
        showToast('Incorrect meaning — read the options carefully.', 'error');
      }
      renderVocabularyStudio(document.getElementById('main-content'));
    }

    // ============================================================================
    // VIEW 8: GRAMMAR LAB (A1-A2, B1-B2, C1-C2)
    // ============================================================================
    let grammarState = { band: 'ALL', selectedId: GRAMMAR_TOPICS[0].id };

    function renderGrammarLab(container) {
      const topics = grammarState.band === 'ALL' ? GRAMMAR_TOPICS : GRAMMAR_TOPICS.filter(t => t.band === grammarState.band);
      const active = topics.find(t => t.id === grammarState.selectedId) || topics[0];

      container.innerHTML = `
        <div class="p-4 space-y-4">
          <div class="flex items-center justify-between">
            <button onclick="navigate('practice')" class="text-xs font-extrabold text-slate-500">← Practice</button>
            <span class="text-xs font-black text-violet-600">CEFR Reference & Drills</span>
          </div>
          <h1 class="text-xl font-black text-slate-900">Grammar Lab</h1>

          <!-- Band Filter -->
          <div class="flex gap-2">
            {['ALL', 'A1–A2', 'B1–B2', 'C1–C2']}
            ${['ALL', 'A1–A2', 'B1–B2', 'C1–C2'].map(b => `
              <button onclick="grammarState.band='${b}'; renderGrammarLab(document.getElementById('main-content'))" class="px-3.5 py-1.5 rounded-xl text-xs font-black ${grammarState.band === b ? 'bg-violet-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">
                ${b}
              </button>
            `).join('').replace("{['ALL', 'A1–A2', 'B1–B2', 'C1–C2']}", '')}
          </div>

          <!-- Topic Selector Pills -->
          <div class="flex gap-2 overflow-x-auto pb-1">
            ${topics.map(t => `
              <button onclick="grammarState.selectedId='${t.id}'; renderGrammarLab(document.getElementById('main-content'))" class="px-3.5 py-2 rounded-2xl text-xs font-extrabold whitespace-nowrap ${active.id === t.id ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-700'}">
                ${escapeHTML(t.title)}
              </button>
            `).join('')}
          </div>

          <!-- Active Grammar Lesson Card -->
          <div class="bg-white rounded-3xl p-5 border border-slate-200 space-y-4 animate-pop">
            <div>
              <span class="text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full bg-violet-100 text-violet-700">CEFR ${active.band}</span>
              <h2 class="text-lg font-black text-slate-900 mt-1">${escapeHTML(active.title)}</h2>
              <p class="text-xs text-slate-600 font-semibold mt-1 leading-relaxed">${escapeHTML(active.explanation)}</p>
            </div>

            <div class="bg-slate-50 rounded-2xl p-3.5 space-y-1.5">
              <h4 class="text-xs font-black uppercase text-slate-700">📐 Grammar Rules</h4>
              ${active.rules.map(r => `<p class="text-xs font-bold text-slate-700">• ${escapeHTML(r)}</p>`).join('')}
            </div>

            <div class="space-y-1.5">
              <h4 class="text-xs font-black uppercase text-emerald-700">✅ Examples</h4>
              ${active.examples.map(ex => `
                <div class="flex items-center justify-between bg-emerald-50/70 px-3 py-2 rounded-xl text-xs font-bold text-emerald-950">
                  <span>"${escapeHTML(ex)}"</span>
                  <button onclick="AudioEngine.speak('${escapeHTML(ex)}')" class="text-emerald-700 ml-2">🔊</button>
                </div>
              `).join('')}
            </div>

            <div class="bg-rose-50/80 border border-rose-200 rounded-2xl p-3.5 space-y-1">
              <h4 class="text-xs font-black uppercase text-rose-700">⚠️ Common Mistakes to Avoid</h4>
              ${active.mistakes.map(m => `<p class="text-xs font-bold text-rose-900">${escapeHTML(m)}</p>`).join('')}
            </div>

            <!-- Short Quiz -->
            <div class="pt-3 border-t border-slate-100 space-y-3">
              <h4 class="text-xs font-black uppercase text-blue-700">📝 Quick Concept Check</h4>
              ${active.quiz.map((qItem, qIdx) => `
                <div class="bg-slate-50 p-3.5 rounded-2xl space-y-2">
                  <p class="text-xs font-extrabold text-slate-900">${qIdx + 1}. ${escapeHTML(qItem.q)}</p>
                  <div class="grid grid-cols-2 gap-1.5">
                    ${qItem.options.map(opt => `
                      <button onclick="checkGrammarQuick('${active.id}', ${qIdx}, '${escapeHTML(opt)}')" class="p-2.5 rounded-xl bg-white border border-slate-200 hover:border-violet-500 text-xs font-bold text-slate-800">
                        ${escapeHTML(opt)}
                      </button>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function checkGrammarQuick(topicId, qIdx, chosen) {
      const topic = GRAMMAR_TOPICS.find(t => t.id === topicId);
      const qItem = topic.quiz[qIdx];
      const isCorrect = chosen === qItem.ans;
      AppState.recordAnswer({ id: `${topicId}_q${qIdx}`, prompt: qItem.q, answer: qItem.ans, skill: 'Grammar' }, isCorrect, 'Grammar');
      if (isCorrect) {
        AudioEngine.success();
        AppState.awardXP(10, 'Grammar Check Passed');
        showToast(`Correct! ${qItem.exp}`, 'success');
      } else {
        AudioEngine.error();
        showToast(`Incorrect. ${qItem.exp}`, 'error');
      }
    }

    // ============================================================================
    // VIEW 9: READING ROOM (GRADED PASSAGES A1 -> C1 + ROTATOR)
    // ============================================================================
    let readingIdx = 0;
    let readingAnswers = {};

    function renderReadingRoom(container) {
      const passage = READING_PASSAGES[readingIdx % READING_PASSAGES.length];
      container.innerHTML = `
        <div class="p-4 space-y-4">
          <div class="flex items-center justify-between">
            <button onclick="navigate('practice')" class="text-xs font-extrabold text-slate-500">← Practice</button>
            <button onclick="nextReadingPassage()" class="px-3 py-1.5 rounded-xl bg-blue-600 text-white text-xs font-black">
              New Passage ↻
            </button>
          </div>
          <h1 class="text-xl font-black text-slate-900">Reading Room</h1>

          <!-- Level Selector -->
          <div class="flex gap-1.5 overflow-x-auto">
            ${READING_PASSAGES.map((p, i) => `
              <button onclick="readingIdx=${i}; readingAnswers={}; renderReadingRoom(document.getElementById('main-content'))" class="px-3 py-1.5 rounded-xl text-xs font-black whitespace-nowrap ${i === (readingIdx % READING_PASSAGES.length) ? 'bg-blue-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}">
                ${p.level} • ${p.category}
              </button>
            `).join('')}
          </div>

          <!-- Passage Card -->
          <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-xs space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-700">CEFR ${passage.level} • ${escapeHTML(passage.category)}</span>
              <button onclick="AudioEngine.speak(${JSON.stringify(passage.text)})" class="text-xs font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full">🔊 Read Aloud</button>
            </div>
            <h2 class="text-lg font-black text-slate-900">${escapeHTML(passage.title)}</h2>
            <p class="text-sm text-slate-700 font-semibold leading-relaxed whitespace-pre-line">${escapeHTML(passage.text)}</p>
          </div>

          <!-- Comprehension Questions -->
          <div class="space-y-3">
            <h3 class="text-xs font-black uppercase text-slate-500">Comprehension Questions</h3>
            ${passage.questions.map((q, qIdx) => {
              const userChoice = readingAnswers[`${passage.id}_${qIdx}`];
              return `
                <div class="bg-white rounded-3xl p-4 border border-slate-200 space-y-2.5">
                  <span class="text-[10px] font-black uppercase text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full">${escapeHTML(q.type)}</span>
                  <p class="text-sm font-extrabold text-slate-900">${qIdx + 1}. ${escapeHTML(q.q)}</p>
                  <div class="space-y-1.5">
                    ${q.options.map(opt => {
                      let cls = 'border-slate-200 bg-slate-50 text-slate-800';
                      if (userChoice) {
                        if (opt === q.ans) cls = 'border-emerald-500 bg-emerald-50 text-emerald-900';
                        else if (opt === userChoice) cls = 'border-rose-500 bg-rose-50 text-rose-900';
                      }
                      return `
                        <button onclick="answerReadingQ('${passage.id}', ${qIdx}, '${escapeHTML(opt)}')" class="w-full text-left p-3 rounded-xl border-2 ${cls} text-xs font-bold">
                          ${escapeHTML(opt)}
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function nextReadingPassage() {
      readingIdx = (readingIdx + 1) % READING_PASSAGES.length;
      readingAnswers = {};
      renderReadingRoom(document.getElementById('main-content'));
    }

    function answerReadingQ(passageId, qIdx, chosen) {
      const key = `${passageId}_${qIdx}`;
      if (readingAnswers[key]) return;
      readingAnswers[key] = chosen;
      const passage = READING_PASSAGES.find(p => p.id === passageId);
      const q = passage.questions[qIdx];
      const isCorrect = chosen === q.ans;
      AppState.recordAnswer({ id: key, prompt: q.q, answer: q.ans, skill: 'Reading' }, isCorrect, 'Reading');
      if (isCorrect) {
        AudioEngine.success();
        AppState.awardXP(10, 'Reading Comprehension');
      } else {
        AudioEngine.error();
      }
      renderReadingRoom(document.getElementById('main-content'));
    }

    // ============================================================================
    // VIEW 10: LISTENING STUDIO (Audio Controls + Hidden Transcript + Dictation)
    // ============================================================================
    let listeningState = {
      idx: 0,
      showTranscript: false,
      rate: 0.95,
      volume: 1.0,
      hasPlayed: false,
      answered: false,
      isCorrect: false
    };

    function renderListeningStudio(container) {
      const task = LISTENING_TASKS[listeningState.idx % LISTENING_TASKS.length];
      const ttsSupported = 'speechSynthesis' in window;

      container.innerHTML = `
        <div class="p-4 space-y-4">
          <div class="flex items-center justify-between">
            <button onclick="navigate('practice')" class="text-xs font-extrabold text-slate-500">← Practice</button>
            <button onclick="nextListeningTask()" class="px-3 py-1.5 rounded-xl bg-amber-500 text-white text-xs font-black">Next Audio ↻</button>
          </div>
          <h1 class="text-xl font-black text-slate-900">Listening Studio</h1>

          <!-- Audio Player Card -->
          <div class="bg-gradient-to-br from-amber-500 to-orange-600 rounded-3xl p-5 text-white shadow-md space-y-4">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-black uppercase bg-white/20 px-2.5 py-0.5 rounded-full">CEFR ${task.level} • ${escapeHTML(task.title)}</span>
              <span class="text-xs font-extrabold">${ttsSupported ? 'Web Speech Audio' : 'Text Fallback Mode'}</span>
            </div>

            ${ttsSupported ? `
              <div class="flex items-center justify-center gap-3 py-2">
                <button onclick="playListeningAudio()" class="duo-btn px-5 py-3 rounded-2xl bg-white text-amber-700 font-black text-sm shadow-sm">
                  ▶ Play
                </button>
                <button onclick="pauseListeningAudio()" class="px-4 py-3 rounded-2xl bg-white/20 hover:bg-white/30 text-white font-black text-xs">
                  ⏸ Pause
                </button>
                <button onclick="replayListeningAudio()" class="px-4 py-3 rounded-2xl bg-white/20 hover:bg-white/30 text-white font-black text-xs">
                  ↺ Replay
                </button>
              </div>
              <div class="grid grid-cols-2 gap-3 text-xs font-bold pt-1">
                <div>
                  <label class="block text-amber-100 text-[10px] uppercase mb-1">Speed: ${listeningState.rate}x</label>
                  <input type="range" min="0.6" max="1.2" step="0.1" value="${listeningState.rate}" onchange="listeningState.rate=Number(this.value)" class="w-full accent-white" />
                </div>
                <div>
                  <label class="block text-amber-100 text-[10px] uppercase mb-1">Volume: ${Math.round(listeningState.volume * 100)}%</label>
                  <input type="range" min="0.2" max="1" step="0.1" value="${listeningState.volume}" onchange="listeningState.volume=Number(this.value)" class="w-full accent-white" />
                </div>
              </div>
            ` : `
              <div class="bg-white/15 rounded-2xl p-3 text-xs font-semibold">
                Audio synthesis is unavailable in this browser. Read the passage carefully using the transcript toggle below.
              </div>
            `}
          </div>

          <!-- Hidden Transcript Toggle -->
          <div class="bg-white rounded-2xl p-3.5 border border-slate-200">
            <div class="flex items-center justify-between">
              <span class="text-xs font-extrabold text-slate-700">Audio Transcript (Hidden Initially)</span>
              <button onclick="toggleTranscript()" class="text-xs font-black text-blue-600">
                ${listeningState.showTranscript ? 'Hide Transcript' : 'Show Transcript'}
              </button>
            </div>
            ${listeningState.showTranscript ? `
              <p class="mt-2.5 pt-2.5 border-t border-slate-100 text-xs font-semibold text-slate-700 italic">
                "${escapeHTML(task.script)}"
              </p>
            ` : ''}
          </div>

          <!-- Comprehension / Dictation Task -->
          <div class="bg-white rounded-3xl p-5 border border-slate-200 space-y-3">
            <h3 class="text-sm font-black text-slate-900">${escapeHTML(task.prompt)}</h3>
            ${task.type === 'dictation' ? `
              <textarea id="dictation-input" rows="2" placeholder="Type what you hear..." class="w-full p-3.5 rounded-2xl border-2 border-slate-200 focus:border-amber-500 focus:outline-none text-sm font-bold"></textarea>
              <button onclick="checkDictation('${task.id}')" class="duo-btn w-full py-3.5 rounded-2xl bg-emerald-500 text-white font-black text-sm shadow-[0_3px_0_0_#059669]">
                Check Dictation
              </button>
            ` : `
              <div class="space-y-2">
                ${task.options.map(opt => `
                  <button onclick="checkListeningMCQ('${task.id}', '${escapeHTML(opt)}')" class="w-full text-left p-3.5 rounded-2xl border-2 border-slate-200 hover:border-amber-500 text-xs font-bold text-slate-800">
                    ${escapeHTML(opt)}
                  </button>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function playListeningAudio() {
      const task = LISTENING_TASKS[listeningState.idx % LISTENING_TASKS.length];
      listeningState.hasPlayed = true;
      if (window.speechSynthesis && window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      } else {
        AudioEngine.speak(task.script, listeningState.rate, listeningState.volume);
      }
    }
    function pauseListeningAudio() {
      if ('speechSynthesis' in window) window.speechSynthesis.pause();
    }
    function replayListeningAudio() {
      const task = LISTENING_TASKS[listeningState.idx % LISTENING_TASKS.length];
      listeningState.hasPlayed = true;
      AudioEngine.speak(task.script, listeningState.rate, listeningState.volume);
    }
    function toggleTranscript() {
      if (!listeningState.hasPlayed && !listeningState.answered && ('speechSynthesis' in window)) {
        showToast('Tip: Listen to the audio at least once before opening the transcript!', 'info');
      }
      listeningState.showTranscript = !listeningState.showTranscript;
      renderListeningStudio(document.getElementById('main-content'));
    }
    function nextListeningTask() {
      AudioEngine.stopSpeech();
      listeningState.idx = (listeningState.idx + 1) % LISTENING_TASKS.length;
      listeningState.showTranscript = false;
      listeningState.hasPlayed = false;
      listeningState.answered = false;
      renderListeningStudio(document.getElementById('main-content'));
    }
    function checkListeningMCQ(taskId, chosen) {
      const task = LISTENING_TASKS.find(t => t.id === taskId);
      const isCorrect = chosen === task.answer;
      listeningState.answered = true;
      AppState.recordAnswer({ id: task.id, prompt: task.prompt, answer: task.answer, skill: 'Listening' }, isCorrect, 'Listening');
      if (isCorrect) {
        AudioEngine.success();
        AppState.awardXP(15, 'Listening Task Solved');
        listeningState.showTranscript = true;
      } else {
        AudioEngine.error();
        showToast('Incorrect — replay the audio and listen for key details.', 'error');
      }
      renderListeningStudio(document.getElementById('main-content'));
    }
    function checkDictation(taskId) {
      const task = LISTENING_TASKS.find(t => t.id === taskId);
