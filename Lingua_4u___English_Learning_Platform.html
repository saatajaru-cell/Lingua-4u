    function startSpeechRecognition() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) return;
      const promptObj = SPEAKING_PROMPTS[speakingState.idx % SPEAKING_PROMPTS.length];
      const recognition = new SpeechRec();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      speakingState.isRecording = true;
      speakingState.errorMsg = '';
      renderSpeakingStudio(document.getElementById('main-content'));

      recognition.onresult = (event) => {
        const spoken = event.results[0][0].transcript;
        speakingState.isRecording = false;
        speakingState.transcript = spoken;

        // Calculate word-overlap similarity
        const cleanWords = s => s.toLowerCase().replace(/[.,!?]/g, '').split(/\s+/).filter(Boolean);
        const targetWords = cleanWords(promptObj.text);
        const spokenWords = cleanWords(spoken);
        const matched = targetWords.filter(w => spokenWords.includes(w)).length;
        const pct = Math.round((matched / targetWords.length) * 100);
        speakingState.similarityScore = pct;

        const passed = pct >= 70;
        AppState.recordAnswer({ id: promptObj.id, prompt: promptObj.text, answer: promptObj.text, skill: 'Speaking' }, passed, 'Speaking');
        if (passed) {
          AudioEngine.success();
          AppState.awardXP(15, 'Clear Pronunciation!');
        } else {
          AudioEngine.error();
        }
        renderSpeakingStudio(document.getElementById('main-content'));
      };

      recognition.onerror = (e) => {
        speakingState.isRecording = false;
        speakingState.errorMsg = `Microphone notice: ${e.error}. Ensure microphone permission is granted or listen to the model audio.`;
        renderSpeakingStudio(document.getElementById('main-content'));
      };

      recognition.onend = () => {
        speakingState.isRecording = false;
      };

      recognition.start();
    }

    function evaluateWritingOrder() {
      const task = WRITING_TASKS[writingState.idx % WRITING_TASKS.length];
      const built = writingState.orderedWords.map(x => x.word).join(' ').replace(/\s+/g, ' ').trim();
      const isCorrect = built === task.answer;
      AppState.recordAnswer({ id: task.id, prompt: task.prompt, answer: task.answer, skill: 'Writing' }, isCorrect, 'Writing');
      if (isCorrect) {
        AudioEngine.success();
        AppState.awardXP(15, 'Sentence Structure Mastered');
        writingState.feedback = { passed: true, headline: '✅ Accurate Word Order!', notes: ['Subject, verb, object, and time expression are positioned naturally.'] };
      } else {
        AudioEngine.error();
        writingState.feedback = { passed: false, headline: '⚠️ Check Word Placement', notes: ['Remember standard English order: Subject + Verb + Object + Place + Time.'], model: task.answer };
      }
      renderWritingWorkshop(document.getElementById('main-content'));

    function evaluateWritingRubric() {
      const task = WRITING_TASKS[writingState.idx % WRITING_TASKS.length];
      const text = (document.getElementById('writing-response-box')?.value || '').trim();
      const words = text.split(/\s+/).filter(Boolean);
      const notes = [];
      let score = 0;

      if (words.length >= task.minWords) {
        score += 1;
        notes.push(`Length check passed (${words.length} words; minimum ${task.minWords}).`);
      } else {
        notes.push(`Write a bit more: ${words.length}/${task.minWords} minimum words.`);
      }

      const startsCap = /^[A-Z]/.test(text);
      const endsPunct = /[.!?]$/.test(text);
      if (startsCap && endsPunct) {
        score += 1;
        notes.push('Mechanics check passed (capitalization and ending punctuation).');
      } else {
        notes.push('Ensure your writing starts with a capital letter and ends with proper punctuation (. ! ?).');
      }

      const lower = text.toLowerCase();
      const missingKw = (task.requiredKeywords || []).filter(kw => !lower.includes(kw));
      if (missingKw.length === 0) {
        score += 1;
        notes.push('Target topic vocabulary included.');
      } else {
        notes.push(`Try incorporating key terms: ${missingKw.join(', ')}.`);
      }

      const passed = score === 3;
      AppState.recordAnswer({ id: task.id, prompt: task.prompt, answer: task.modelAnswer, skill: 'Writing' }, passed, 'Writing');
      if (passed) {
        AudioEngine.success();
        AppState.awardXP(20, 'Writing Rubric Passed');
      } else {
        AudioEngine.error();
      }
      writingState.feedback = {
        passed,
        headline: passed ? '🌟 Rubric Criteria Met (3/3)' : `📝 Rubric Feedback (${score}/3 Criteria Met)`,
        notes,
        model: task.modelAnswer
      };
      renderWritingWorkshop(document.getElementById('main-content'));
    }

          </div>

          <!-- Architecture & Research Transparency Note -->
          <div class="bg-slate-100 rounded-3xl p-4 border border-slate-200 space-y-1.5 text-xs text-slate-600 font-semibold">
            <p class="font-black text-slate-800">🔬 System & Research Transparency</p>
            <p>• <strong>Project:</strong> "The Effect of Mobile Applications on English Learning" (Lingua 4u).</p>
            <p>• <strong>Persistence:</strong> All user data is saved locally in Browser LocalStorage (no external cloud backend required).</p>
            <p>• <strong>Question Generation:</strong> Combines a curated CEFR question bank with a deterministic parametric template generator and seen-question history tracking (no external LLM API connected).</p>
          </div>

          <!-- Danger Zone: Reset Progress -->
          <div class="pt-2 pb-4">
            <button onclick="confirmResetProgress()" class="w-full py-3.5 rounded-2xl bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-600 font-black text-sm">
              Reset All Learning Progress
            </button>
          </div>
        </div>
      `;
    }

    function promptRenameUser() {
      openModal(`
        <h3 class="text-lg font-black text-slate-900 mb-2">Edit Learner Name</h3>
        <input id="rename-input" type="text" maxlength="28" value="${escapeHTML(AppState.data.user.name)}" class="w-full px-4 py-3 rounded-2xl border-2 border-slate-200 font-bold text-sm mb-4" />
        <div class="flex gap-3">
          <button onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-slate-100 text-slate-700 font-extrabold text-sm">Cancel</button>
          <button onclick="saveRenamedUser()" class="flex-1 py-3 rounded-2xl bg-emerald-500 text-white font-extrabold text-sm">Save</button>
        </div>
      `);
    }

    function saveRenamedUser() {
      const val = (document.getElementById('rename-input')?.value || '').trim();
      if (!val) return;
      AppState.data.user.name = val;
      AppState.save();
      closeModal();
      renderProfile(document.getElementById('main-content'));
    }

    function updateDailyGoal(val) {
      AppState.data.stats.dailyGoal = val;
      AppState.save();
      showToast(`Daily goal updated to ${val} XP`, 'success');
      renderProfile(document.getElementById('main-content'));
    }

    function toggleSetting(key) {
      AppState.data.settings[key] = !AppState.data.settings[key];
      AppState.save();
      renderProfile(document.getElementById('main-content'));
    }

    function confirmResetProgress() {
      openModal(`
        <h3 class="text-lg font-black text-rose-600 mb-2">Reset All Progress?</h3>
        <p class="text-sm text-slate-600 font-semibold mb-5">
          This will permanently erase your XP, daily streak, completed lessons, CEFR placement history, and saved words from this browser.
        </p>
        <div class="flex gap-3">
          <button onclick="closeModal()" class="flex-1 py-3 rounded-2xl bg-slate-100 text-slate-700 font-extrabold text-sm">Cancel</button>
          <button onclick="closeModal(); AppState.resetAll()" class="flex-1 py-3 rounded-2xl bg-rose-600 text-white font-extrabold text-sm">Yes, Reset Everything</button>
        </div>
      `);
    }

    // ============================================================================
    // INITIALIZATION & NETWORK STATUS LISTENERS
    // ============================================================================
    window.addEventListener('online', () => document.getElementById('offline-banner').classList.add('hidden'));
    window.addEventListener('offline', () => document.getElementById('offline-banner').classList.remove('hidden'));

    window.onload = function () {
      AppState.load();
      if (!navigator.onLine) {
        document.getElementById('offline-banner').classList.remove('hidden');
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
      }
      if (AppState.data.onboarded) {
        navigate('home');
      } else {
        navigate('welcome');
      }
    };
  </script>
</body>
</html>
